<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analytics temps réel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background-color: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #999;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.3s;
            text-decoration: none;
        }

        .back-button:hover {
            color: #fff;
        }

        .logo {
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            display: none;
        }

        @media (min-width: 640px) {
            .logo {
                display: block;
            }
        }

        main {
            padding-top: 57px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            height: auto;
            max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .zoom-controls {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: rgba(24, 24, 24, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 2rem;
        }

        .zoom-button {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }

        .zoom-button:hover {
            color: #fff;
        }

        .zoom-percentage {
            font-size: 0.75rem;
            font-family: "JetBrains Mono", monospace;
            color: #999;
            min-width: 3rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="back-button">← Retour</a>
        <span class="logo">Dashboard Analytics</span>
        <span style="width: 100px;"></span>
    </header>

    <div class="zoom-controls">
        <button class="zoom-button" id="zoomOut" title="Zoomer dehors">−</button>
        <span class="zoom-percentage" id="zoomLevel">100%</span>
        <button class="zoom-button" id="zoomIn" title="Zoomer dedans">+</button>
    </div>

    <main>
        <div class="container" id="container">
            <img src="./processus/crm.webp" alt="Dashboard Analytics temps réel" id="image">
        </div>
    </main>

    <script>
        let zoom = 100;
        const image = document.getElementById('image');
        const zoomLevel = document.getElementById('zoomLevel');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const container = document.getElementById('container');

        function updateZoom() {
            image.style.transform = `scale(${zoom / 100})`;
            image.style.transformOrigin = 'center';
            zoomLevel.textContent = `${zoom}%`;
        }

        zoomInBtn.addEventListener('click', () => {
            if (zoom < 300) {
                zoom = Math.min(300, zoom + 10);
                updateZoom();
            }
        });

        zoomOutBtn.addEventListener('click', () => {
            if (zoom > 50) {
                zoom = Math.max(50, zoom - 10);
                updateZoom();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '+' || e.key === '=') {
                zoomInBtn.click();
            } else if (e.key === '-') {
                zoomOutBtn.click();
            }
        });

        // Scroll to top on load
        window.scrollTo(0, 0);
    </script>
</body>
</html>
