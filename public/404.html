<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page non trouvée | FRANCKV</title>
    <link rel="icon" type="image/png" href="/LOGO/FAVICON.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;700;900&display=swap" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .bg-animation svg {
            width: 100%;
            height: 100%;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            width: 90%;
            text-align: center;
            padding: 60px 40px;
            background: rgba(15, 15, 23, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .error-code {
            font-family: 'Orbitron', monospace;
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #f97316 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .error-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .error-description {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            animation: wobble 2s ease-in-out infinite;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .cta-section {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .btn {
            padding: 12px 32px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn-primary {
            background: #f97316;
            color: #fff;
        }

        .btn-primary:hover {
            background: #ea6b0a;
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            border-color: #f97316;
            color: #f97316;
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.2);
        }

        .logo-section {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-text-f {
            color: #f97316;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 72px;
            }

            .error-title {
                font-size: 24px;
            }

            .container {
                padding: 40px 24px;
            }

            .cta-section {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            <circle cx="200" cy="200" r="100" fill="#f97316" opacity="0.1"/>
            <circle cx="800" cy="800" r="150" fill="#ef4444" opacity="0.1"/>
            <rect x="50" y="500" width="120" height="120" fill="#f97316" opacity="0.05"/>
            <path d="M 600 100 L 700 200 L 600 300 L 500 200 Z" fill="#ef4444" opacity="0.05"/>
        </svg>
    </div>

    <div class="container">
        <div class="error-icon">🔍</div>
        
        <div class="error-code">404</div>
        
        <h1 class="error-title">Page non trouvée</h1>
        
        <p class="error-description">
            Oups! La page que vous recherchez n'existe pas ou a été déplacée. Retournez à l'accueil pour continuer votre navigation.
        </p>

        <div class="cta-section">
            <a href="/" class="btn btn-primary">← Retour à l'accueil</a>
            <a href="/#projets" class="btn btn-secondary">Voir les projets</a>
        </div>

        <div class="logo-section">
            <div class="logo-text">
                <span class="logo-text-f">F</span>RANCK<span class="logo-text-f">V</span>
            </div>
            <div style="font-size: 12px; color: #666; margin-top: 12px; font-family: 'JetBrains Mono', monospace;">
                Consultant Digital — Paris
            </div>
        </div>
    </div>
</body>
</html>
